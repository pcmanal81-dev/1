<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>كشف جنس المولود</title>

<style>
body {
  margin: 0;
  height: 100vh;
  background: black;
  color: white;
  font-family: Arial;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  overflow: hidden;
  transition: 0.5s ease;
}

#text {
  font-size: 34px;
  transition: 0.3s ease;
  z-index: 2;
}

.big { font-size: 70px; font-weight: bold; }

.white { color: white; }

.blue { color: #4da3ff; }

</style>
</head>

<body>

<div id="text">...</div>

<!-- 🎵 موسيقى -->
<audio id="heart" loop>
<source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8b8f7f8f7.mp3">
</audio>

<audio id="cheer">
<source src="https://cdn.pixabay.com/download/audio/2022/03/10/audio_crowd_cheer.mp3">
</audio>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>

let text = document.getElementById("text");
let heart = document.getElementById("heart");
let cheer = document.getElementById("cheer");

function show(msg, time, big=false){
  setTimeout(()=>{
    text.innerHTML = msg;
    text.className = "white" + (big ? " big" : "");
  }, time);
}

function pinkScene(msg, time){
  setTimeout(()=>{
    document.body.style.background = "#ff4fb8"; // pink
    text.innerHTML = msg;
    text.className = "white big";
  }, time);
}

function blackScene(time){
  setTimeout(()=>{
    document.body.style.background = "black";
  }, time);
}

function blueScene(time, msg){
  setTimeout(()=>{
    document.body.style.background = "#001a33";
    text.innerHTML = msg;
    text.className = "blue big";
  }, time);
}

window.onload = () => {

heart.play().catch(()=>{});

// 🖤 البداية (أسود)
show("أول حفيد في بيت الشرايعة", 500);
show("مين رح يكون؟", 2500);
show("السؤال الكبير...", 4500);
show("ولد أم بنت؟", 6500);

// 🖤 تشويق
blackScene(7000);
show("تحليل...", 8000);
show("النتائج تتجمع...", 10000);
show("القلب ينبض أسرع...", 12000);

// 💗 بنت (خلفية وردي + نص أبيض)
pinkScene("بنت 💗", 14000);

pinkScene("فيونكات 🎀", 16000);
pinkScene("ورود 🌸", 18000);
pinkScene("دباديب 🧸", 20000);
pinkScene("كل شيء يقول بنت 💗", 22000);

// 🖤 رجوع توتر
blackScene(24000);
show("انتظروا...", 24500);
show("لكن لحظة...", 26500);

// ⏳ عد تنازلي
show("3", 28500, true);
show("2", 30000, true);
show("1", 31500, true);

// 💙 كشف الولد
blueScene(33000, "💙 إنه ولد 💙");

// 🎉 كونفيتي
setTimeout(()=>{
cheer.play();

let end = Date.now() + 3000;

(function frame(){
  confetti({
    particleCount: 10,
    spread: 120,
    origin: { y: 0.6 }
  });

  if(Date.now() < end){
    requestAnimationFrame(frame);
  }
})();
}, 33500);

};

</script>

</body>
</html>
