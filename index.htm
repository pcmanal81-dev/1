<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>كشف جنس المولود</title>

<style>
body {
  margin: 0;
  height: 100vh;
  background: black;
  color: white;
  font-family: Arial;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  overflow: hidden;
}

#text {
  font-size: 32px;
  transition: all 0.5s ease;
}

.big {
  font-size: 60px;
  font-weight: bold;
}

.blue { color: #4da3ff; }
.pink { color: #ff69b4; }

</style>
</head>

<body>

<div id="text">جاري التحضير...</div>

<!-- 🎵 موسيقى -->
<audio id="music"
src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8b8f7f8f7.mp3?filename=suspense-110096.mp3">
</audio>

<!-- 💥 كونفيتي -->
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>

let text = document.getElementById("text");
let music = document.getElementById("music");

function show(msg, time, color="", big=false){
  setTimeout(()=>{
    text.innerHTML = msg;
    text.className = color + (big ? " big" : "");
  }, time);
}

// ▶️ تشغيل تلقائي
window.onload = () => {

  music.play().catch(()=>{});

  // 🖤 البداية
  show("أول حفيد في بيت الشرايعة...", 500);
  show("حان وقت المفاجأة...", 3000);
  show("السؤال هو...", 5000);
  show("Boy or Girl?", 6500);

  // 📊 تقلبات
  show("الاحتمالات تتغير...", 8000);
  show("بنت 62% / ولد 38%", 9500, "pink");
  show("بنت 45% / ولد 55%", 11000, "blue");
  show("بنت 71% / ولد 29%", 13000, "pink");

  // 💗 خداع
  show("كل المؤشرات تقول: بنت 💗", 15000, "pink");

  // ⚠️ توتر
  show("انتظروا...", 17000);
  show("ليس بعد...", 18500);

  // ⏳ عد تنازلي
  show("3", 20000, "", true);
  show("2", 21500, "", true);
  show("1", 23000, "", true);

  // 💥 كشف نهائي
  setTimeout(()=>{

    document.body.style.background = "#001a33";

    text.innerHTML = "💙 IT'S A BOY 💙";
    text.className = "blue big";

    // 🎉 انفجار
    let end = Date.now() + 3000;

    (function frame(){
      confetti({
        particleCount: 6,
        spread: 90,
        origin: { y: 0.6 }
      });

      if(Date.now() < end){
        requestAnimationFrame(frame);
      }
    })();

  }, 24500);

};

</script>

</body>
</html>
