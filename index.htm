<html lang="ar">
<head>

<title>كشف جنس المولود</title>

<style>
body {

  height: 100vh;

  color: white;
  font-family: Arial;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  overflow: hidden;
}

#startScreen, #revealScreen {
  position: absolute;
  width: 100%;
  height: 100%;

  justify-content: center;
  align-items: center;
  flex-direction: column;
}

button {
  padding: 15px 30px;
  font-size: 18px;
  border: none;
  cursor: pointer;
  border-radius: 10px;
}

#text {
  font-size: 32px;
  transition: all 0.5s ease;
}

.big {
  font-size: 60px;
  font-weight: bold;
}

.blue { color: #4da3ff; }
.pink { color: #ff69b4; }

.hidden { display: none; }

</style>
</head>

<div id="startScreen">
