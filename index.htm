<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>Gender Reveal</title>

<style>
body {
  margin: 0;
  height: 100vh;
  background: black;
  color: white;
  font-family: Arial;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  overflow: hidden;
}

#text {
  font-size: 34px;
  transition: all 0.2s ease;
}

.big { font-size: 65px; font-weight: bold; }

.blue { color: #4da3ff; }
.pink { color: #ff69b4; }
</style>
</head>

<body>

<div id="text">...</div>

<audio id="music"
src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8b8f7f8f7.mp3?filename=suspense-110096.mp3">
</audio>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>

let text = document.getElementById("text");
let music = document.getElementById("music");

function show(msg, time, color="", big=false){
  setTimeout(()=>{
    text.innerHTML = msg;
    text.className = color + (big ? " big" : "");
  }, time);
}

window.onload = () => {

music.play().catch(()=>{});

// 🖤 بداية أسرع
show("أول حفيد في بيت الشرايعة", 200);
show("مين هو؟", 1200);
show("السؤال الكبير...", 2000);
show("Boy or Girl?", 2600);

// 📊 إحصائيات سريعة جدًا (تضليل قوي)
show("بنت 55% / ولد 45%", 3200, "pink");
show("بنت 68% / ولد 32%", 3600, "pink");
show("بنت 73% / ولد 27%", 4000, "pink");
show("بنت 81% / ولد 19%", 4400, "pink");
show("بنت 88% / ولد 12%", 4800, "pink");
show("بنت 92% / ولد 8%", 5200, "pink");

// 💗 تأكيد وهمي
show("كل شيء يشير إلى بنت 💗", 5800, "pink");
show("أكيد بنت...", 6500, "pink");

// ⚠️ توتر
show("لحظة...", 7200);
show("انتظروا...", 7800);

// ⏳ عد سريع
show("3", 8400, "", true);
show("2", 9000, "", true);
show("1", 9600, "", true);

// 💥 كشف
setTimeout(()=>{

document.body.style.background = "#001a33";

text.innerHTML = "💙 IT'S A BOY 💙";
text.className = "blue big";

// 🎉 انفجار قوي
let end = Date.now() + 2500;

(function frame(){
  confetti({
    particleCount: 8,
    spread: 100,
    origin: { y: 0.6 }
  });

  if(Date.now() < end){
    requestAnimationFrame(frame);
  }
})();

}, 10500);

};

</script>

</body>
</html>
